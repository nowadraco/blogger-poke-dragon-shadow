<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador Estático de Doces</title>
</head>
<body style="background:#121212; color:white; font-family:sans-serif; padding:20px;">
    <h1>🍬 Fábrica Estática de Doces</h1>
    <button onclick="gerarEBaixarDoces()" style="padding:10px 20px; background:#f1c40f; border:none; font-weight:bold; cursor:pointer;">Gerar e Salvar Doces</button>
    <div id="galeria" style="display:flex; gap:15px; flex-wrap:wrap; margin-top:20px;"></div>

    <script>
        async function gerarEBaixarDoces() {
            const response = await fetch("https://cdn.jsdelivr.net/gh/nowadraco/blogger-poke-dragon-shadow@main/json/dados_pogo/doces_colorir/PokemonCandyColorData.json");
            const data = await response.json();
            const listaCores = data.CandyColors || [];

            const galeria = document.getElementById("galeria");
            galeria.innerHTML = "Processando e baixando imagens...";

            const urlMascara = "https://raw.githubusercontent.com/nowadraco/pokedragonshadow/refs/heads/main/assets/imagens/icones/doce_rgb.png";

            for (const colorInfo of listaCores) {
                const familyId = colorInfo.FamilyId;
                const pR = colorInfo.PrimaryColor.r * 255;
                const pG = colorInfo.PrimaryColor.g * 255;
                const pB = colorInfo.PrimaryColor.b * 255;
                const sR = colorInfo.SecondaryColor.r * 255;
                const sG = colorInfo.SecondaryColor.g * 255;
                const sB = colorInfo.SecondaryColor.b * 255;

                await new Promise((resolve) => {
                    const img = new Image();
                    img.crossOrigin = "Anonymous";
                    img.onload = () => {
                        const canvas = document.createElement("canvas");
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext("2d");
                        ctx.drawImage(img, 0, 0);

                        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const pixels = imgData.data;

                        for (let i = 0; i < pixels.length; i += 4) {
                            if (pixels[i+3] < 10) continue;
                            const r = pixels[i], g = pixels[i+1], b = pixels[i+2];
                            const brilho = (r + g + b) / 3;

                            if (g > r + 20) {
                                pixels[i] = pR; pixels[i+1] = pG; pixels[i+2] = pB;
                            } else if (r > g + 20) {
                                pixels[i] = sR; pixels[i+1] = sG; pixels[i+2] = sB;
                            }

                            const fatorLuz = Math.max(0.5, brilho / 128);
                            pixels[i] = Math.min(255, pixels[i] * fatorLuz);
                            pixels[i+1] = Math.min(255, pixels[i+1] * fatorLuz);
                            pixels[i+2] = Math.min(255, pixels[i+2] * fatorLuz);
                        }

                        ctx.putImageData(imgData, 0, 0);
                        const dataUrl = canvas.toDataURL("image/png");

                        // 📥 **NOVIDADE: DISPARA O DOWNLOAD AUTOMÁTICO DO ARQUIVO**
                        const link = document.createElement("a");
                        link.href = dataUrl;
                        link.download = `family_${familyId}.png`; // Salva como family_1.png, family_2.png, etc.
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);

                        // Mostra na tela o card de visualização
                        const card = document.createElement("div");
                        card.style.cssText = "background:#222; padding:10px; text-align:center; border-radius:8px;";
                        card.innerHTML = `<img src="${dataUrl}" style="width:50px; display:block; margin:auto;"><small>Família ${familyId}</small>`;
                        galeria.appendChild(card);

                        // Pequena pausa de segurança (100ms) entre os downloads para o navegador não engasgar
                        setTimeout(resolve, 100);
                    };
                    img.src = urlMascara;
                });
            }
            galeria.prepend("✅ Concluído! Todas as imagens foram geradas e baixadas para a sua pasta de Downloads.\n");
        }
    </script>
</body>
</html>

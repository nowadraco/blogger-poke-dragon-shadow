<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria Pokémon - Normal & Shiny</title>
    <!-- Carregando Tailwind CSS para um design moderno e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonte moderna do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0fdf4; /* Fundo verde muito claro inspirado em Pokémon grama */
            background-image: radial-gradient(#dcfce7 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Efeito de brilho para os cards */
        .pokemon-card {
            transition: all 0.3s ease;
        }
        .pokemon-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-8 text-gray-800">

    <div class="max-w-7xl mx-auto">
        <!-- Cabeçalho -->
        <header class="text-center mb-12 mt-4">
            <h1 class="text-4xl md:text-5xl font-extrabold text-green-800 tracking-tight mb-4 drop-shadow-sm">
                Poké <span class="text-yellow-500">Galeria</span>
            </h1>
            <p class="text-gray-600 max-w-2xl mx-auto text-lg">
                Explorando a lista de Pokémon com suas formas normais e brilhantes (Shiny).
            </p>
            
            <!-- Barra de pesquisa simples -->
            <div class="mt-8 max-w-md mx-auto relative">
                <input type="text" id="searchInput" placeholder="Buscar Pokémon..." 
                    class="w-full px-5 py-3 rounded-full border-2 border-green-200 focus:border-green-500 focus:ring-4 focus:ring-green-100 outline-none transition-all shadow-sm text-center font-medium">
            </div>
        </header>

        <!-- Container de Carregamento -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="w-16 h-16 border-4 border-green-200 border-t-green-600 rounded-full animate-spin mb-4"></div>
            <p class="text-green-800 font-semibold animate-pulse">Capturando dados dos Pokémon...</p>
        </div>

        <!-- Grid onde os cards serão injetados -->
        <!-- O Tailwind gerencia a responsividade: 1 coluna no mobile, 2 em telas pequenas, 3 em médias, 4 em grandes -->
        <div id="pokemon-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 hidden">
            <!-- Cards entrarão aqui -->
        </div>

        <!-- Mensagem de erro caso a API falhe -->
        <div id="error-message" class="hidden flex-col items-center justify-center py-20 text-red-500 text-center">
            <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <h2 class="text-2xl font-bold">Ops! Algo deu errado.</h2>
            <p class="mt-2 text-gray-600">Não foi possível carregar os dados. Tente atualizar a página.</p>
        </div>
    </div>

    <script>
        // URL fornecida contendo o JSON atualizada para a CDN
        const DATA_URL = 'https://cdn.jsdelivr.net/gh/nowadraco/blogger-poke-dragon-shadow@a38d282f33c18091b97ffcb2823133d43351bca3/json/imagens_pokemon.json';
        
        // Elementos da DOM
        const grid = document.getElementById('pokemon-grid');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('error-message');
        const searchInput = document.getElementById('searchInput');
        
        let pokemonData = []; // Armazenará os dados globais para permitir a pesquisa

        // Função para formatar a URL da imagem (remover proxy e mudar para jsdelivr)
        function formatImageUrl(url) {
            if (!url) return null;
            
            let cleanUrl = url;
            
            // 1. Remove o proxy weserv
            if (cleanUrl.includes('images.weserv.nl/?&url=')) {
                cleanUrl = cleanUrl.split('url=')[1];
                cleanUrl = decodeURIComponent(cleanUrl); // Decodifica caso a URL tenha vindo encodada no parâmetro
            }
            
            // 2. Converte raw.githubusercontent para cdn.jsdelivr.net
            // Exemplo: https://raw.githubusercontent.com/nowadraco/pogo_assets/refs/heads/master/Images/...
            const githubRegex = /^https?:\/\/raw\.githubusercontent\.com\/([^\/]+)\/([^\/]+)\/(?:refs\/heads\/)?([^\/]+)\/(.*)$/i;
            const match = cleanUrl.match(githubRegex);
            
            if (match) {
                const user = match[1];
                const repo = match[2];
                const branch = match[3] === 'master' || match[3] === 'main' ? match[3] : match[3]; // Mantém a branch
                const path = match[4];
                cleanUrl = `https://cdn.jsdelivr.net/gh/${user}/${repo}@${branch}/${path}`;
            }
            
            return cleanUrl;
        }

        // Função para extrair apenas o nome do arquivo
        function extractFileName(url) {
            if (!url) return '';
            try {
                const cleanUrl = formatImageUrl(url);
                const decodedUrl = decodeURIComponent(cleanUrl);
                let arquivo = decodedUrl.split('/').pop();
                return arquivo.split('?')[0]; // Remove parâmetros finais
            } catch (e) {
                return 'arquivo.png';
            }
        }

        // Função principal para buscar e renderizar os dados
        async function fetchPokemon() {
            try {
                const response = await fetch(DATA_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                pokemonData = await response.json();
                
                // Esconde o loading e mostra o grid
                loading.classList.add('hidden');
                grid.classList.remove('hidden');
                
                // Renderiza todos os Pokémon inicialmente
                renderCards(pokemonData);

            } catch (error) {
                console.error("Erro ao buscar os dados:", error);
                loading.classList.add('hidden');
                errorMessage.classList.remove('hidden');
                errorMessage.classList.add('flex');
            }
        }

        // Função para criar o HTML dos cards baseado numa lista de Pokémon
        function renderCards(data) {
            grid.innerHTML = ''; // Limpa o grid antes de renderizar
            
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500 font-medium">Nenhum Pokémon encontrado.</div>`;
                return;
            }

            data.forEach(pokemon => {
                // Prepara as URLs e nomes de arquivo
                const finalImgNormal = formatImageUrl(pokemon.imgNormal);
                const finalImgShiny = formatImageUrl(pokemon.imgShiny);
                const fileNameNormal = extractFileName(pokemon.imgNormal);
                const fileNameShiny = extractFileName(pokemon.imgShiny);

                // Previne a quebra do layout se a imagem normal estiver nula
                const imgNormalSrc = finalImgNormal || 'https://placehold.co/256x256/f3f4f6/a1a1aa?text=Sem+Imagem';
                
                // Monta a seção Shiny APENAS se o pokemon.imgShiny não for null ou vazio
                let shinySectionHtml = '';
                if (pokemon.imgShiny) {
                    shinySectionHtml = `
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-yellow-600 font-mono break-all mb-2 text-center px-1 max-w-[100px] leading-tight h-8 flex items-center justify-center">${fileNameShiny}</span>
                            <div class="bg-gradient-to-tr from-yellow-50 to-amber-100 rounded-2xl p-2 mb-3 shadow-inner w-24 h-24 flex items-center justify-center">
                                <img src="${finalImgShiny}" alt="${pokemon.nome} Shiny" 
                                     class="w-full h-full object-contain drop-shadow-md hover:scale-110 transition-transform duration-300"
                                     loading="lazy" 
                                     onerror="this.src='https://placehold.co/256x256/f3f4f6/a1a1aa?text=Erro'">
                            </div>
                            <span class="text-[10px] sm:text-xs font-bold text-yellow-700 bg-yellow-200 px-3 py-1 rounded-full uppercase tracking-wider shadow-sm flex items-center gap-1">
                                Shiny <span class="text-sm leading-none">✨</span>
                            </span>
                        </div>
                    `;
                }

                // Cria o elemento principal do card
                const card = document.createElement('div');
                card.className = 'pokemon-card bg-white rounded-3xl p-5 border border-green-50 flex flex-col justify-between h-full';
                
                // Adiciona o conteúdo HTML do card
                card.innerHTML = `
                    <h2 class="text-lg sm:text-xl font-bold text-gray-800 mb-2 text-center line-clamp-2 flex items-center justify-center min-h-[3rem]">
                        ${pokemon.nome}
                    </h2>
                    
                    <div class="flex gap-3 sm:gap-4 w-full justify-center items-end mt-auto pt-4 border-t border-gray-100">
                        <!-- Imagem Normal -->
                        <div class="flex flex-col items-center">
                            <span class="text-[10px] text-gray-400 font-mono break-all mb-2 text-center px-1 max-w-[100px] leading-tight h-8 flex items-center justify-center">${fileNameNormal || 'sem_arquivo.png'}</span>
                            <div class="bg-gray-50 rounded-2xl p-2 mb-3 shadow-inner w-24 h-24 flex items-center justify-center">
                                <img src="${imgNormalSrc}" alt="${pokemon.nome} Normal" 
                                     class="w-full h-full object-contain drop-shadow-md hover:scale-110 transition-transform duration-300"
                                     loading="lazy"
                                     onerror="this.src='https://placehold.co/256x256/f3f4f6/a1a1aa?text=Erro'">
                            </div>
                            <span class="text-[10px] sm:text-xs font-bold text-gray-600 bg-gray-200 px-3 py-1 rounded-full uppercase tracking-wider shadow-sm">
                                Normal
                            </span>
                        </div>
                        
                        <!-- Imagem Shiny (Injetada condicionalmente) -->
                        ${shinySectionHtml}
                    </div>
                `;
                
                grid.appendChild(card);
            });
        }

        // Lógica da barra de pesquisa para filtrar os Pokémon pelo nome
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase().trim();
            const filteredData = pokemonData.filter(pokemon => 
                pokemon.nome.toLowerCase().includes(searchTerm)
            );
            renderCards(filteredData);
        });

        // Inicia a aplicação
        window.onload = fetchPokemon;

    </script>
</body>
</html>
